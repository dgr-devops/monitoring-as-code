groups:
  - name: host
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target caído: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Prometheus no logra scrapear {{ $labels.instance }} (job {{ $labels.job }}) desde hace más de 1 minuto."
          runbook_url: "https://github.com/dgr-devops/runbooks-and-postmortems/blob/main/runbooks/servicio-caido.md"

      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU alta en {{ $labels.instance }}"
          description: "Uso de CPU {{ $value | printf \"%.1f\" }}% (>85%) sostenido durante 10 minutos."
          runbook_url: "https://github.com/dgr-devops/runbooks-and-postmortems/blob/main/runbooks/alta-carga-cpu.md"

      - alert: DiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "El disco {{ $labels.mountpoint }} se llenará en <24h en {{ $labels.instance }}"
          description: "Según la tendencia de las últimas 6h, {{ $labels.mountpoint }} ({{ $labels.device }}) se queda sin espacio en menos de 24 horas."
          runbook_url: "https://github.com/dgr-devops/runbooks-and-postmortems/blob/main/runbooks/disco-lleno.md"

      - alert: DiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Menos del 10% libre en {{ $labels.mountpoint }} ({{ $labels.instance }})"
          description: "Quedan {{ $value | humanizePercentage }} libres en {{ $labels.mountpoint }}."
          runbook_url: "https://github.com/dgr-devops/runbooks-and-postmortems/blob/main/runbooks/disco-lleno.md"

      - alert: MemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Presión de memoria en {{ $labels.instance }}"
          description: "Solo {{ $value | humanizePercentage }} de la RAM está disponible desde hace 5 minutos."
          runbook_url: "https://github.com/dgr-devops/runbooks-and-postmortems/blob/main/runbooks/memoria-agotada-oom.md"
